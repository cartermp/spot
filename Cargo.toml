[workspace]
resolver = "2"
members = [
    "crates/spot-core",
    "crates/spot-audio",
    "crates/spot-spotify",
    "crates/spot-app",
    "crates/spot-verify",
]
default-members = ["crates/spot-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Carter Phillip"]

[workspace.dependencies]
spot-core = { path = "crates/spot-core" }
spot-audio = { path = "crates/spot-audio" }
spot-spotify = { path = "crates/spot-spotify" }
spot-verify = { path = "crates/spot-verify" }

tokio = { version = "1.40", features = ["full"] }
flume = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "2.0"
dirs = "5.0"

# Audio & DSP
cpal = "0.16"
rodio = { version = "0.21", default-features = false }
rtrb = "0.3"
realfft = "3.4"

# Spotify Premium & Web API
librespot-core = "0.8"
librespot-playback = { version = "0.8", features = ["rodio-backend"] }
librespot-oauth = "0.8"
librespot-metadata = "0.8"
librespot-protocol = "0.8"
protobuf = "3.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# GUI
iced = { version = "0.13", features = ["tokio", "wgpu", "image", "svg", "canvas", "advanced"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Formal Verification & Model Checking
stateright = "0.31"
proptest = "1.5"
